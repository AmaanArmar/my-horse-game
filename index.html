<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horse Game</title>
    <style>
        body { background-color: #121214; color: #f4f4f5; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; background: #1a1a1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { background: #1a1a1e; border: none; color: #f4f4f5; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .nav-tab.active { background: #fbbf24; color: #000; }
        .tab-pane { display: none; background: #1a1a1e; padding: 20px; border-radius: 8px; }
        .tab-pane.active { display: block; }
        button { cursor: pointer; padding: 8px 14px; border-radius: 5px; border: none; background: #3f3f46; color: #fff; font-weight: bold; }
        button:hover { background: #52525b; }
        .racetrack { position: relative; height: 280px; background: #22c55e; border-radius: 8px; overflow: hidden; margin-top: 15px; border: 4px solid #15803d; }
        .racer { position: absolute; left: 0px; width: 80px; height: 90px; display: flex; align-items: center; }
        .racer img { width: 75px; height: auto; image-rendering: pixelated; }
        .lane { border-bottom: 2px dashed rgba(255,255,255,0.4); height: 90px; position: relative; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h2>🐎 Horse Stable & Race</h2>
            <div>
                <span id="gold-display" style="margin-right: 15px; font-weight: bold;">🪙 450</span>
                <span id="diamond-display" style="font-weight: bold;">💎 42</span>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" id="btn-stable" onclick="switchTab('stable', this)">Stable</button>
            <button class="nav-tab" id="btn-race" onclick="switchTab('race', this)">Race Track</button>
            <button class="nav-tab" id="btn-breeding" onclick="switchTab('breeding', this)">Breeding</button>
        </div>

        <!-- Stable Tab -->
        <div id="stable-tab" class="tab-pane active">
            <h3>Active Horse</h3>
            <div style="display: flex; gap: 20px; align-items: center;">
                <div style="background: #27272a; padding: 10px; border-radius: 8px; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;">
                    <img id="horse-image-display" src="3903_2.png" style="max-width: 90px; max-height: 90px;" alt="Horse">
                </div>
                <div>
                    <h2 id="horse-name-display" style="margin: 0 0 5px 0;">Misty</h2>
                    <div id="horse-meta-display" style="color: #a1a1aa; font-size: 0.9rem; margin-bottom: 10px;">Mare | Arabian</div>
                    <div>Power: <span id="power-display">100</span> | Energy: <span id="energy-display">95</span></div>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button onclick="careForHorse('feed')">Feed (🪙 50)</button>
                <button onclick="careForHorse('rest')">Rest (🪙 100)</button>
                <button onclick="buyRandomHorse()" style="background: #fbbf24; color: #000;">Buy Horse (🪙 500)</button>
            </div>
            <h3 style="margin-top: 25px;">Stable Inventory</h3>
            <div id="stable-inventory" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <!-- Race Tab -->
        <div id="race-tab" class="tab-pane">
            <h3>Live Race Track</h3>
            <div id="lap-indicator" style="font-weight: bold; margin-bottom: 10px; color: #fbbf24;">Lap 1 / 3</div>
            <div id="race-track" class="racetrack">
                <div class="lane" id="lane-player">
                    <div id="player-racer" class="racer" style="top: 0px;"><img id="player-img" src="3903_2.png" alt="Player"></div>
                </div>
                <div class="lane" id="lane-ai1">
                    <div id="ai1-racer" class="racer" style="top: 0px;"><img id="ai1-img" src="3903_2.png" alt="AI 1"></div>
                </div>
                <div class="lane" id="lane-ai2" style="border-bottom: none;">
                    <div id="ai2-racer" class="racer" style="top: 0px;"><img id="ai2-img" src="3903_2.png" alt="AI 2"></div>
                </div>
            </div>
            <button onclick="startLiveRace()" style="margin-top: 15px; padding: 12px 24px; background: #fbbf24; color: #000; font-size: 1rem;">Start Live Race!</button>
        </div>

        <!-- Breeding Tab -->
        <div id="breeding-tab" class="tab-pane">
            <h3>Horse Breeding Studio (Cost: 💎 5 Diamonds)</h3>
            <div style="display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap;">
                <div>
                    <label>Select Stallion:</label><br>
                    <select id="stallion-select" style="padding: 8px; width: 220px; margin-top: 5px; background: #27272a; color: #fff; border-radius: 4px;"></select>
                </div>
                <div>
                    <label>Select Mare:</label><br>
                    <select id="mare-select" style="padding: 8px; width: 220px; margin-top: 5px; background: #27272a; color: #fff; border-radius: 4px;"></select>
                </div>
            </div>
            <button onclick="breedHorses()" style="padding: 10px 20px; background: #38bdf8; color: #000;">Breed Foal</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
